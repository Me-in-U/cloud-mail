name: Diagnose Cloud Mail migration

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect schedules and D1 schema
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          DB_LIST=$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API/d1/database")
          DB_ID=$(jq -r '.result[] | select(.name == "cloud-mail") | .uuid' <<< "$DB_LIST")
          test -n "$DB_ID"
          if SCHEDULES=$(curl --fail --silent -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$API/workers/scripts/cloud-mail/schedules"); then
            echo "Schedules: $(jq -r '[.. | objects | select(has("cron")) | .cron] | unique | join(", ")' <<< "$SCHEDULES")"
          else
            echo "Schedules could not be read with this token."
          fi
          for TABLE in setting email; do
            BODY=$(jq -n --arg sql "PRAGMA table_info($TABLE)" '{sql: $sql}')
            RESULT=$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data "$BODY" "$API/d1/database/$DB_ID/query")
            echo "$TABLE columns: $(jq -r '[.result[0].results[].name] | join(", ")' <<< "$RESULT")"
          done
          BODY=$(jq -n --arg sql "SELECT name FROM sqlite_master WHERE type = 'index'" '{sql: $sql}')
          RESULT=$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data "$BODY" "$API/d1/database/$DB_ID/query")
          echo "Indexes: $(jq -r '[.result[0].results[].name] | join(", ")' <<< "$RESULT")"
